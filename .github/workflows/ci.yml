name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  e2e:
    name: End-to-end on kind
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install kind
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - name: Build, deploy and run the lifecycle checks
        run: bash scripts/e2e.sh
      - name: Operator logs
        if: failure()
        run: kubectl -n vmlease-system logs deploy/vmlease-operator --tail=200
